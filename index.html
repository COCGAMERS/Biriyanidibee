<!DOCTYPE html>
<html>
<head>
    <title>Mosque Entry</title>
    <style>
        body { font-family: Arial; background: #f2f2f2; text-align: center; }
        form { background: white; padding: 20px; width: 300px; margin: 20px auto; border-radius: 10px; }
        input, button { width: 90%; padding: 10px; margin: 10px; }
        button { background: green; color: white; border: none; cursor: pointer; }
        table { margin: auto; background: white; border-collapse: collapse; }
        th, td { padding: 10px; border: 1px solid #ddd; }
    </style>
</head>
<body>

<h2>Mosque Entry Form</h2>

<form id="entryForm">
    <input type="text" id="mosqueName" placeholder="Mosque Name" required>
    <input type="time" id="time" required>
    <input type="text" id="userName" placeholder="Your Name" required>
    <button type="submit">Submit</button>
</form>

<h2>Saved Entries</h2>
<table>
    <thead>
        <tr>
            <th>Mosque</th>
            <th>Time</th>
            <th>Name</th>
        </tr>
    </thead>
    <tbody id="dataTable"></tbody>
</table>

<script>
const form = document.getElementById("entryForm");

form.addEventListener("submit", async (e) => {
    e.preventDefault();

    const data = {
        mosqueName: document.getElementById("mosqueName").value,
        time: document.getElementById("time").value,
        userName: document.getElementById("userName").value
    };

    await fetch("http://localhost:5000/add", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data)
    });

    loadData();
});

async function loadData() {
    const res = await fetch("http://localhost:5000/entries");
    const entries = await res.json();

    const table = document.getElementById("dataTable");
    table.innerHTML = "";

    entries.forEach(e => {
        table.innerHTML += `
            <tr>
                <td>${e.mosqueName}</td>
                <td>${e.time}</td>
                <td>${e.userName}</td>
            </tr>
        `;
    });
}

loadData();
</script>

</body>
</html>
