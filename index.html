<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mosque Prayer Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h2>Mosque Entry Form</h2>
        
        <form id="prayerForm">
            <input type="text" id="mosqueName" placeholder="Mosque Name" required>
            <input type="date" id="visitDate" required>
            
            <select id="prayerType" required>
                <option value="" disabled selected>Select Prayer</option>
                <option value="Fajar">Fajar</option>
                <option value="Zahur">Zahur</option>
                <option value="Asar">Asar</option>
                <option value="Magrib">Magrib</option>
                <option value="Esha">Esha</option>
            </select>

            <button type="submit">Submit Entry</button>
        </form>

        <hr>

        <h3>Submitted Entries</h3>
        
        <table id="entryTable">
            <thead>
                <tr>
                    <th>Mosque Name</th>
                    <th>Date</th>
                    <th>Prayer</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                </tbody>
        </table>
    </div>

    <script src="script.js"></script>
</body>
</html>
