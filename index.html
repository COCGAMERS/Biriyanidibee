<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Map Report System</title>

<!-- Leaflet CSS -->
<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
}

/* Top Header */
.header {
  position: absolute;
  top: 0;
  width: 100%;
  background: white;
  padding: 10px;
  z-index: 1000;
  box-shadow: 0 2px 5px rgba(0,0,0,0.1);
  display: flex;
  gap: 10px;
}

.search-box {
  flex: 1;
  padding: 8px;
  border-radius: 20px;
  border: 1px solid #ccc;
}

/* Map */
#map {
  height: 100vh;
  width: 100%;
}

/* Summary Bar */
.summary {
  position: absolute;
  top: 60px;
  left: 10px;
  background: green;
  color: white;
  padding: 8px 12px;
  border-radius: 20px;
  font-size: 14px;
  z-index: 1000;
}

/* Floating Add Button */
.add-btn {
  position: absolute;
  right: 20px;
  bottom: 120px;
  background: orange;
  color: white;
  width: 55px;
  height: 55px;
  border-radius: 50%;
  font-size: 30px;
  text-align: center;
  line-height: 55px;
  cursor: pointer;
  z-index: 1000;
}

/* Bottom Panel */
.bottom-panel {
  position: absolute;
  bottom: 0;
  width: 100%;
  background: #0f6b2f;
  color: white;
  max-height: 250px;
  overflow-y: auto;
  border-top-left-radius: 20px;
  border-top-right-radius: 20px;
  padding: 10px;
  z-index: 1000;
}

.report-card {
  background: white;
  color: black;
  padding: 10px;
  border-radius: 10px;
  margin-top: 10px;
}
</style>
</head>
<body>

<div class="header">
  <input type="text" class="search-box" placeholder="Search location..." />
</div>

<div class="summary">Total Spots: 101</div>

<div id="map"></div>

<div class="add-btn">+</div>

<div class="bottom-panel">
  <h3>Today's Reports</h3>

  <div class="report-card">
    <strong>Rafael Nadal - Road Closed</strong>
    <p>Location: Agargaon</p>
  </div>

  <div class="report-card">
    <strong>Patrick Mahomes - Traffic Jam</strong>
    <p>Location: Banani</p>
  </div>

</div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
// Initialize Map (Bangladesh Center)
var map = L.map('map').setView([25.6279, 88.6332], 13);

// OpenStreetMap Layer
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© OpenStreetMap contributors'
}).addTo(map);

// Custom Red Icon
var redIcon = L.icon({
  iconUrl: "https://cdn-icons-png.flaticon.com/512/684/684908.png",
  iconSize: [30, 30]
});

// Example Markers
var locations = [
  [23.8103, 90.4125, "Dhaka - Traffic Jam"],
  [22.3569, 91.7832, "Chittagong - Road Closed"],
  [24.3636, 88.6241, "Rajshahi - Accident"],
  [25.7439, 89.2752, "Rangpur - Jam"]
];

locations.forEach(function(loc) {
  L.marker([loc[0], loc[1]], {icon: redIcon})
    .addTo(map)
    .bindPopup(loc[2]);
});

// Add marker on map click
map.on('click', function(e) {
  L.marker(e.latlng, {icon: redIcon})
    .addTo(map)
    .bindPopup("New Report Here")
    .openPopup();
});
</script>

</body>
</html>
